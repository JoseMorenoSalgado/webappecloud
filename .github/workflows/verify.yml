name: Verificación Next.js + MariaDB + PostgreSQL
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: webappecloud_ci
          MARIADB_USER: ciuser
          MARIADB_PASSWORD: ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pgci
          POSTGRES_PASSWORD: pg_password_only
          POSTGRES_DB: webappecloud_pg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pgci -d webappecloud_pg_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://ciuser:ci_password_only@127.0.0.1:3306/webappecloud_ci
      SEED_DOMAIN: localhost
      ADMIN_EMAIL: admin@ci.invalid
      ADMIN_PASSWORD: CI-PASSWORD-NOT-PRODUCTION-2345
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar recuperación no destructiva
        run: npm run test:recovery
      - name: Validar esquema Prisma
        run: |
          npx prisma validate --schema prisma/schema.prisma
          DATABASE_URL=postgresql://pgci:pg_password_only@127.0.0.1:5432/webappecloud_pg_ci npx prisma validate --schema prisma/schema.postgres.prisma
          npm run db:generate
      - name: Crear esquema en base efímera de CI
        run: npx prisma db push
      - name: Crear datos de prueba
        run: npm run db:seed
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Compilar Next.js
        run: npm run build
        env:
          NODE_ENV: production
      - name: Iniciar servidor de prueba
        run: |
          npm run start > /tmp/webappecloud-next.log 2>&1 &
          echo $! > /tmp/webappecloud-server.pid
          timeout 90 bash -c 'until curl -fsS http://localhost:3000/ >/dev/null; do sleep 2; done'
        env:
          NODE_ENV: production
      - name: Smoke test - web pública, catálogo, PDF y formulario
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/ | grep -qi 'NEXUS'
          curl -fsS http://localhost:3000/propiedades | grep -qi 'Catálogo'
          curl -fsS http://localhost:3000/propiedades/casa-zona-ejecutiva | grep -qi 'NX-102'
          curl -fsS http://localhost:3000/api/propiedades/casa-zona-ejecutiva/pdf -o /tmp/nexus-ficha.pdf
          head -c 5 /tmp/nexus-ficha.pdf | grep -q '%PDF-'
          curl -fsS -X POST http://localhost:3000/api/leads \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Cliente de pruebas","phone":"88887777","email":"cliente@example.com","consent":"yes","message":"Deseo conocer la propiedad."}' | grep -q '"ok":true'
          curl -fsS -X POST http://localhost:3000/api/events \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"kind":"view","path":"/"}' | grep -q '"ok":true'
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)"
          test "$CODE" = "307" || test "$CODE" = "308"
          echo 'Smoke tests exitosos'
        env:
          NODE_ENV: production
      - name: Probar inicio de sesión real y dashboard
        run: node scripts/check-admin-access.mjs
      - name: Probar vista previa sin MariaDB, solo en dominio autorizado
        run: |
          set -euo pipefail
          env -u DATABASE_URL SITE_PREVIEW_MODE=true SITE_PREVIEW_HOST=inmo.elearningcloud.org PORT=3001 NODE_ENV=production npm run start > /tmp/webappecloud-preview.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://localhost:3001/api/live >/dev/null; do sleep 2; done'
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/ -o /tmp/nexus-preview-home.html
          grep -qi 'Vista previa de NEXUS' /tmp/nexus-preview-home.html
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/propiedades -o /tmp/nexus-preview-catalog.html
          grep -qi 'Catálogo de propiedades' /tmp/nexus-preview-catalog.html
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/api/propiedades/casa-zona-ejecutiva/pdf -o /tmp/nexus-demo.pdf
          head -c 5 /tmp/nexus-demo.pdf | grep -q '%PDF-'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' http://localhost:3001/)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health)" = "503"
        env:
          NODE_ENV: production
      - name: Prueba real del asistente de instalación MariaDB
        run: |
          set -euo pipefail
          printf "CREATE DATABASE IF NOT EXISTS webappecloud_install_ci; GRANT ALL PRIVILEGES ON webappecloud_install_ci.* TO 'ciuser'@'%%';" | sed 's/%%/%/g' | npx prisma db execute --url "mysql://root:ci_root_only@127.0.0.1:3306/webappecloud_ci" --stdin
          INSTALL_TMP="$(mktemp -d)"
          env -u DATABASE_URL -u INSTALLER_TOKEN APP_CONFIG_DIR="$INSTALL_TMP" SITE_PREVIEW_MODE=false PORT=3002 NODE_ENV=production npm run start > /tmp/webappecloud-installer.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://localhost:3002/api/live >/dev/null; do sleep 2; done'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/)" = "307"
          curl -fsS http://localhost:3002/instalar -o /tmp/nexus-wizard.html
          grep -qi "instalación inicial" /tmp/nexus-wizard.html
          test -s "$INSTALL_TMP/installer-token"
          # Generate the request locally, without printing the secret into workflow logs.
          node -e 'const fs=require("node:fs");const key=fs.readFileSync(process.argv[1],"utf8").trim();if(key.length!==64)process.exit(1);const data={setupToken:key,dbHost:"127.0.0.1",dbPort:"3306",dbName:"webappecloud_install_ci",dbUser:"ciuser",dbPassword:"ci_password_only",institution:"Nexus Real Estate",institutionEmail:"nexus@example.com",adminName:"Administrador Nexus",adminEmail:"admin-nexus@example.com",adminPassword:"long-safe-password-for-test-1234"};fs.writeFileSync("/tmp/webappecloud-install-request.json",JSON.stringify(data),{mode:0o600});' "$INSTALL_TMP/installer-token"
          curl -fsS -H 'Origin: http://localhost:3002' -H 'Content-Type: application/json' -X POST http://localhost:3002/api/install \
            --data-binary @/tmp/webappecloud-install-request.json | grep -q '"ok":true'
          test ! -e "$INSTALL_TMP/installer-token"
          curl -fsS http://localhost:3002/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3002/ -o /tmp/nexus-after-install.html
          grep -qi 'NEXUS' /tmp/nexus-after-install.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/instalar)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:3002' -H 'Content-Type: application/json' -d '{}' http://localhost:3002/api/install)" = "409"
        env:
          NODE_ENV: production
      - name: PostgreSQL - instalación completa desde el asistente
        run: |
          set -euo pipefail
          INSTALL_PG_TMP="$(mktemp -d)"
          env -u DATABASE_URL -u INSTALLER_TOKEN APP_CONFIG_DIR="$INSTALL_PG_TMP" SITE_PREVIEW_MODE=false PORT=3003 NODE_ENV=production npm run start > /tmp/webappecloud-postgres.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://localhost:3003/api/live >/dev/null; do sleep 2; done'
          curl -fsS http://localhost:3003/instalar -o /tmp/nexus-postgres-installer.html
          grep -qi 'PostgreSQL' /tmp/nexus-postgres-installer.html
          test -s "$INSTALL_PG_TMP/installer-token"
          node -e 'const fs=require("fs");const key=fs.readFileSync(process.argv[1],"utf8").trim();const body={setupToken:key,dbType:"postgresql",dbHost:"127.0.0.1",dbPort:"5432",dbName:"webappecloud_pg_ci",dbUser:"pgci",dbPassword:"pg_password_only",institution:"Nexus Real Estate",institutionEmail:"nexus-pg@example.com",adminName:"Administrador Postgres",adminEmail:"admin-postgres@example.com",adminPassword:"long-postgres-test-password-2026"};fs.writeFileSync("/tmp/webappecloud-pg-request.json",JSON.stringify(body),{mode:0o600});' "$INSTALL_PG_TMP/installer-token"
          curl -fsS -X POST http://localhost:3003/api/install \
            -H 'Origin: http://localhost:3003' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/webappecloud-pg-request.json | grep -q '"ok":true'
          curl -fsS http://localhost:3003/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3003/ -o /tmp/nexus-postgres-home.html
          grep -qi 'NEXUS' /tmp/nexus-postgres-home.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3003/instalar)" = "307"
          test ! -e "$INSTALL_PG_TMP/installer-token"
        env:
          NODE_ENV: production
      - name: Recuperar conexión existente en ambos motores
        run: |
          set -euo pipefail
          RECOVERY_MYSQL_TMP="$(mktemp -d)"
          APP_CONFIG_DIR="$RECOVERY_MYSQL_TMP" RECOVERY_HOST=localhost npm run installation:restore
          test -s "$RECOVERY_MYSQL_TMP/installation.json"
          RECOVERY_PG_TMP="$(mktemp -d)"
          DATABASE_URL=postgresql://pgci:pg_password_only@127.0.0.1:5432/webappecloud_pg_ci APP_CONFIG_DIR="$RECOVERY_PG_TMP" RECOVERY_HOST=localhost npm run installation:restore
          test -s "$RECOVERY_PG_TMP/installation.json"
      - name: Probar inicio de sesión real PostgreSQL
        run: node scripts/check-admin-access.mjs
        env:
          TEST_ORIGIN: http://localhost:3003
          ADMIN_EMAIL: admin-postgres@example.com
          ADMIN_PASSWORD: long-postgres-test-password-2026
      - name: Mostrar logs si falla
        if: failure()
        run: |
          cat /tmp/webappecloud-next.log 2>/dev/null || true
          cat /tmp/webappecloud-preview.log 2>/dev/null || true
          cat /tmp/webappecloud-installer.log 2>/dev/null || true
          cat /tmp/webappecloud-postgres.log 2>/dev/null || true
