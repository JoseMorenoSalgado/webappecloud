name: Verificación Next.js + MariaDB
on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_only
          MARIADB_DATABASE: webappecloud_ci
          MARIADB_USER: ciuser
          MARIADB_PASSWORD: ci_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://ciuser:ci_password_only@127.0.0.1:3306/webappecloud_ci
      SEED_DOMAIN: localhost
      ADMIN_EMAIL: admin@ci.invalid
      ADMIN_PASSWORD: CI-PASSWORD-NOT-PRODUCTION-2345
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar esquema Prisma
        run: |
          npx prisma validate
          npx prisma generate
      - name: Crear esquema en base efímera de CI
        run: npx prisma db push
      - name: Crear datos de prueba
        run: npm run db:seed
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - name: Compilar Next.js
        run: npm run build
        env:
          NODE_ENV: production
      - name: Iniciar servidor de prueba
        run: |
          npm run start > /tmp/webappecloud-next.log 2>&1 &
          echo $! > /tmp/webappecloud-server.pid
          timeout 90 bash -c 'until curl -fsS http://localhost:3000/ >/dev/null; do sleep 2; done'
        env:
          NODE_ENV: production
      - name: Smoke test - web pública, catálogo, PDF y formulario
        run: |
          set -euo pipefail
          curl -fsS http://localhost:3000/ | grep -qi 'NEXUS'
          curl -fsS http://localhost:3000/propiedades | grep -qi 'Catálogo'
          curl -fsS http://localhost:3000/propiedades/casa-zona-ejecutiva | grep -qi 'NX-102'
          curl -fsS http://localhost:3000/api/propiedades/casa-zona-ejecutiva/pdf -o /tmp/nexus-ficha.pdf
          head -c 5 /tmp/nexus-ficha.pdf | grep -q '%PDF-'
          curl -fsS -X POST http://localhost:3000/api/leads \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Cliente de pruebas","phone":"88887777","email":"cliente@example.com","consent":"yes","message":"Deseo conocer la propiedad."}' | grep -q '"ok":true'
          curl -fsS -X POST http://localhost:3000/api/events \
            -H 'Origin: http://localhost:3000' \
            -H 'Content-Type: application/json' \
            -d '{"kind":"view","path":"/"}' | grep -q '"ok":true'
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin)"
          test "$CODE" = "307" || test "$CODE" = "308"
          echo 'Smoke tests exitosos'
        env:
          NODE_ENV: production
      - name: Probar vista previa sin MariaDB, solo en dominio autorizado
        run: |
          set -euo pipefail
          env -u DATABASE_URL SITE_PREVIEW_MODE=true SITE_PREVIEW_HOST=inmo.elearningcloud.org PORT=3001 NODE_ENV=production npm run start > /tmp/webappecloud-preview.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://localhost:3001/api/live >/dev/null; do sleep 2; done'
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/ -o /tmp/nexus-preview-home.html
          grep -qi 'Vista previa de NEXUS' /tmp/nexus-preview-home.html
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/propiedades -o /tmp/nexus-preview-catalog.html
          grep -qi 'Catálogo de propiedades' /tmp/nexus-preview-catalog.html
          curl -fsS -H 'Host: inmo.elearningcloud.org' http://localhost:3001/api/propiedades/casa-zona-ejecutiva/pdf -o /tmp/nexus-demo.pdf
          head -c 5 /tmp/nexus-demo.pdf | grep -q '%PDF-'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.com' http://localhost:3001/)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/health)" = "503"
        env:
          NODE_ENV: production
      - name: Prueba real del asistente de instalación MariaDB
        run: |
          set -euo pipefail
          printf "CREATE DATABASE IF NOT EXISTS webappecloud_install_ci; GRANT ALL PRIVILEGES ON webappecloud_install_ci.* TO 'ciuser'@'%%';" | sed 's/%%/%/g' | npx prisma db execute --url "mysql://root:ci_root_only@127.0.0.1:3306/webappecloud_ci" --stdin
          INSTALL_TMP="$(mktemp -d)"
          env -u DATABASE_URL APP_CONFIG_DIR="$INSTALL_TMP" INSTALLER_TOKEN="CI-test-installer-very-long-secure-token-2026" SITE_PREVIEW_MODE=false PORT=3002 NODE_ENV=production npm run start > /tmp/webappecloud-installer.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://localhost:3002/api/live >/dev/null; do sleep 2; done'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/)" = "307"
          curl -fsS http://localhost:3002/instalar -o /tmp/nexus-wizard.html
          grep -qi "instalación inicial" /tmp/nexus-wizard.html
          curl -fsS -H 'Origin: http://localhost:3002' -H 'Content-Type: application/json' -X POST http://localhost:3002/api/install \
            --data '{"setupToken":"CI-test-installer-very-long-secure-token-2026","dbHost":"127.0.0.1","dbPort":"3306","dbName":"webappecloud_install_ci","dbUser":"ciuser","dbPassword":"ci_password_only","institution":"Nexus Real Estate","institutionEmail":"nexus@example.com","adminName":"Administrador Nexus","adminEmail":"admin-nexus@example.com","adminPassword":"long-safe-password-for-test-1234"}' | grep -q '"ok":true'
          curl -fsS http://localhost:3002/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3002/ -o /tmp/nexus-after-install.html
          grep -qi 'NEXUS' /tmp/nexus-after-install.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/instalar)" = "307"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://localhost:3002' -H 'Content-Type: application/json' -d '{}' http://localhost:3002/api/install)" = "409"
        env:
          NODE_ENV: production
      - name: Mostrar logs si falla
        if: failure()
        run: |
          cat /tmp/webappecloud-next.log 2>/dev/null || true
          cat /tmp/webappecloud-preview.log 2>/dev/null || true
          cat /tmp/webappecloud-installer.log 2>/dev/null || true
