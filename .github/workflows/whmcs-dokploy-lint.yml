name: WHMCS Dokploy module checks

on:
  pull_request:
    paths:
      - 'integrations/whmcs/modules/servers/eclouddokploy/**'
      - '.github/workflows/whmcs-dokploy-lint.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/whmcs/modules/servers/eclouddokploy/**'

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP syntax
        run: |
          php -v
          find integrations/whmcs/modules/servers/eclouddokploy -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run offline contract checks
        run: php integrations/whmcs/modules/servers/eclouddokploy/tests/validate.php
      - name: Verify HTTPS handshake, auth and read-only Dokploy contract (mock)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="integrations/whmcs/modules/servers/eclouddokploy"
          TEMP_DIR="$(mktemp -d)"
          trap 'if [ -n "${MOCK_PID:-}" ]; then sudo pkill -P "$MOCK_PID" || true; kill "$MOCK_PID" || true; fi; rm -rf "$TEMP_DIR"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TEMP_DIR/key.pem" -out "$TEMP_DIR/cert.pem" -days 1 -subj "/CN=dokploy.test" -addext "subjectAltName=DNS:dokploy.test" >/dev/null 2>&1
          echo "127.0.0.1 dokploy.test" | sudo tee -a /etc/hosts >/dev/null
          sudo env MOCK_CERT="$TEMP_DIR/cert.pem" MOCK_KEY="$TEMP_DIR/key.pem" python3 "$ROOT/tests/mock_dokploy_https.py" >/dev/null 2>&1 &
          MOCK_PID=$!
          export NO_PROXY="dokploy.test,localhost,127.0.0.1"
          export no_proxy="$NO_PROXY"
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --cacert "$TEMP_DIR/cert.pem" -H 'x-api-key: test-key-very-long' https://dokploy.test/api/project.all >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then echo 'Mock TLS server failed to start'; exit 1; fi
          export ECLOUD_DOKPLOY_URL="https://dokploy.test"
          export ECLOUD_DOKPLOY_API_KEY="test-key-very-long"
          export ECLOUD_DOKPLOY_TEST_APPLICATION_ID="stagingapp123"
          php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/remote_readonly.php" | tee "$TEMP_DIR/output.txt"
          grep -q '"status":"pass"' "$TEMP_DIR/output.txt"
          grep -q '"test_application_lookup":"ok"' "$TEMP_DIR/output.txt"
          export ECLOUD_DOKPLOY_API_KEY="wrong-token"
          if php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/remote_readonly.php" > "$TEMP_DIR/denied.txt"; then
            echo 'Invalid Dokploy token was accepted'; exit 1
          fi
          grep -q '"status":"fail"' "$TEMP_DIR/denied.txt"
          if grep -q 'wrong-token' "$TEMP_DIR/denied.txt"; then
            echo 'Diagnostic leaked auth secret'; exit 1
          fi
