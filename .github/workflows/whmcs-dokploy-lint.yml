name: WHMCS Dokploy module checks

on:
  pull_request:
    paths:
      - 'integrations/whmcs/modules/servers/eclouddokploy/**'
      - '.github/workflows/whmcs-dokploy-lint.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/whmcs/modules/servers/eclouddokploy/**'

permissions:
  contents: read

jobs:
  php-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP syntax
        run: |
          php -v
          find integrations/whmcs/modules/servers/eclouddokploy -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run offline contract checks
        run: php integrations/whmcs/modules/servers/eclouddokploy/tests/validate.php
      - name: Verify HTTPS handshake, auth and read-only Dokploy contract (mock)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="integrations/whmcs/modules/servers/eclouddokploy"
          TEMP_DIR="$(mktemp -d)"
          trap 'if [ -n "${MOCK_PID:-}" ]; then sudo pkill -P "$MOCK_PID" || true; kill "$MOCK_PID" || true; fi; rm -rf "$TEMP_DIR"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TEMP_DIR/key.pem" -out "$TEMP_DIR/cert.pem" -days 1 -subj "/CN=dokploy.test" -addext "subjectAltName=DNS:dokploy.test" >/dev/null 2>&1
          echo "127.0.0.1 dokploy.test" | sudo tee -a /etc/hosts >/dev/null
          sudo env MOCK_CERT="$TEMP_DIR/cert.pem" MOCK_KEY="$TEMP_DIR/key.pem" python3 "$ROOT/tests/mock_dokploy_https.py" >/dev/null 2>&1 &
          MOCK_PID=$!
          export NO_PROXY="dokploy.test,localhost,127.0.0.1"
          export no_proxy="$NO_PROXY"
          ready=0
          for i in $(seq 1 30); do
            if curl --silent --fail --cacert "$TEMP_DIR/cert.pem" -H 'x-api-key: test-key-very-long' https://dokploy.test/api/project.all >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then echo 'Mock TLS server failed to start'; exit 1; fi
          export ECLOUD_DOKPLOY_URL="https://dokploy.test"
          export ECLOUD_DOKPLOY_API_KEY="test-key-very-long"
          export ECLOUD_DOKPLOY_TEST_APPLICATION_ID="stagingapp123"
          php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/remote_readonly.php" | tee "$TEMP_DIR/output.txt"
          grep -q '"status":"pass"' "$TEMP_DIR/output.txt"
          grep -q '"test_application_lookup":"ok"' "$TEMP_DIR/output.txt"
          # Mutations below operate ONLY on the ephemeral local mock's RAM.
          php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/mock_project_isolation.php"
          export ECLOUD_DOKPLOY_API_KEY="wrong-token"
          if php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/remote_readonly.php" > "$TEMP_DIR/denied.txt"; then
            echo 'Invalid Dokploy token was accepted'; exit 1
          fi
          grep -q '"status":"fail"' "$TEMP_DIR/denied.txt"
          if grep -q 'wrong-token' "$TEMP_DIR/denied.txt"; then
            echo 'Diagnostic leaked auth secret'; exit 1
          fi
      - name: Verify corporate mail UAPI over TLS (ephemeral mock only)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="integrations/whmcs/modules/servers/eclouddokploy"
          TEMP_DIR="$(mktemp -d)"
          trap 'kill "${MAIL_MOCK_PID:-0}" 2>/dev/null || true; rm -rf "$TEMP_DIR"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TEMP_DIR/key.pem" -out "$TEMP_DIR/cert.pem" -days 1 -subj "/CN=mail.test" -addext "subjectAltName=DNS:mail.test" >/dev/null 2>&1
          echo "127.0.0.1 mail.test" | sudo tee -a /etc/hosts >/dev/null
          env MOCK_CERT="$TEMP_DIR/cert.pem" MOCK_KEY="$TEMP_DIR/key.pem" python3 "$ROOT/tests/mock_cpanel_mail_https.py" >/dev/null 2>&1 &
          MAIL_MOCK_PID=$!
          export NO_PROXY="mail.test,localhost,127.0.0.1"
          export no_proxy="$NO_PROXY"
          ready=0
          for i in $(seq 1 25); do
            if curl --silent --fail --cacert "$TEMP_DIR/cert.pem" -H 'Authorization: cpanel eclient:cpanel-staging-token-123456789' 'https://mail.test:2083/execute/Email/list_pops_with_disk?domain=empresa.test' >/dev/null; then ready=1; break; fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then echo 'cPanel mock TLS server failed to start'; exit 1; fi
          ECLOUD_CPANEL_TEST_HOST="mail.test" ECLOUD_CPANEL_TEST_TOKEN="cpanel-staging-token-123456789" php -d curl.cainfo="$TEMP_DIR/cert.pem" "$ROOT/tests/remote_mail_mock.php"

      - name: Package WHMCS Dokploy module for staging
        shell: bash
        run: |
          set -euo pipefail
          SRC="integrations/whmcs/modules/servers/eclouddokploy"
          mkdir -p dist/eclouddokploy/lib dist/eclouddokploy/templates
          cp "$SRC/eclouddokploy.php" dist/eclouddokploy/
          cp "$SRC/lib/DokployClient.php" "$SRC/lib/ClientOperations.php" "$SRC/lib/ServerRouting.php" "$SRC/lib/ProjectIsolation.php" "$SRC/lib/CpanelMail.php" "$SRC/lib/EmailOperations.php" "$SRC/lib/SelfService.php" dist/eclouddokploy/lib/
          cp "$SRC/templates/clientarea.tpl" dist/eclouddokploy/templates/
          cat > dist/LEEME-INSTALACION.txt <<'EOF'
          MODULO ELEARNING CLOUD DOKPLOY — SOLO PRUEBAS
          Copiar eclouddokploy a <WHMCS_ROOT>/modules/servers/
          En WHMCS, crear un producto de prueba separado de los paquetes cPanel.
          Seleccionar el modulo eclouddokploy en los ajustes del producto.
          Cada servicio genera su propio proyecto y entorno Dokploy.
          Este modulo NO figura en Modulos adicionales; es un modulo de servidor.
          Correo corporativo: vincula un segundo servicio WHMCS cPanel activo,
          usa un token UAPI por cuenta en un archivo privado fuera de public_html.
          Funciones correo desactivadas hasta habilitar en staging.
          Instalacion de apps: activar solo staging las variables
          ECLOUD_DOKPLOY_ENABLE_SELF_SERVICE y ECLOUD_DOKPLOY_ENABLE_PROVISIONING.
          Importacion publica de GitHub desde la ficha App Ecloud en Lagom.
          No soporta GitHub privado OAuth ni dominio gratuito automatizado.
          No activar creacion automatica de servicios ni redespliegues en produccion.
          API keys y secretos solo en el entorno privado del servidor WHMCS.
          Guias: docs/WHMCS-DOKPLOY-GIT-MARIADB.md en GitHub.
          PR: https://github.com/JoseMorenoSalgado/webappecloud/pull/38
          EOF
          cd dist
          zip -qr ../eclouddokploy-whmcs-staging.zip eclouddokploy LEEME-INSTALACION.txt
          unzip -t ../eclouddokploy-whmcs-staging.zip
      - name: Publish downloadable staging ZIP
        uses: actions/upload-artifact@v4
        with:
          name: eclouddokploy-whmcs-staging
          path: eclouddokploy-whmcs-staging.zip
          if-no-files-found: error
          retention-days: 30
