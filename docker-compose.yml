# Ambiente de STAGING aislado de Edvorya. No publica puertos al host.
# Variables requeridas en Dockploy:
# MARIADB_PASSWORD, MARIADB_ROOT_PASSWORD, DATABASE_URL, SEED_DOMAIN
# DATABASE_URL: mysql://webappecloud:URL_ENCODED_PASSWORD@db:3306/webappecloud
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: ${DATABASE_URL:?Configura DATABASE_URL en Dockploy}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - webapp-internal
    # No maps ports: Dockploy configurará dominio TLS al servicio app:3000.
    deploy:
      resources:
        limits:
          memory: 1024M
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: webappecloud
      MARIADB_USER: webappecloud
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Configura MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Configura MARIADB_ROOT_PASSWORD}
    volumes:
      - webapp-mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - webapp-internal
    deploy:
      resources:
        limits:
          memory: 1024M
volumes:
  webapp-mariadb:
networks:
  webapp-internal:
    driver: bridge
